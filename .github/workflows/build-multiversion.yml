name: Build Neo Voxy multiversion

on:
  workflow_dispatch:
  push:
    branches: [multiversion]
  pull_request:
    branches: [multiversion]

permissions:
  contents: read

jobs:
  build:
    name: Build multiversion bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Remember JDK 17
        shell: bash
        run: echo "JAVA_HOME_17=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Remember JDK 21
        shell: bash
        run: echo "JAVA_HOME_21=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Remember JDK 25
        shell: bash
        run: echo "JAVA_HOME_25=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build all releases
        run: bash scripts/build-all.sh

      - name: Verify release set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find dist -maxdepth 1 -type f -name '*.jar' -print | sort)
          if (( ${#jars[@]} != 4 )); then
            printf 'Expected 4 release JARs, found %d:\n' "${#jars[@]}" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi
          sha256sum "${jars[@]}"

      - name: Upload multiversion bundle
        uses: actions/upload-artifact@v7
        with:
          name: neo-voxy-multiversion
          path: dist/*.jar
          if-no-files-found: error
          compression-level: 0
